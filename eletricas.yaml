# eletricas.yaml — Price Discovery Scanning BR
# Classificação das empresas do segmento B3 "Energia Elétrica" para o EBITDA ajustado (ebitda_ajustado).
# A B3 põe todas no mesmo segmento, por isso a curadoria é por empresa (chave = CNPJ da CVM, só dígitos).
#
# tipo:     transmissao | distribuicao | integrada | geracao | holding
# ajustes:  transmissao  -> EBITDA + custo de construção − Δ ativo de contrato/concessão (BP)
#                           (tira receita de construção, remuneração e correção monetária do ativo; entra a RAP faturada)
#           vnr          -> EBITDA − atualização do ativo financeiro indenizável (VNR), ajuste não-caixa da DFC
#           bonificacao  -> EBITDA − Δ saldo da bonificação pela outorga (BP) (UHEs do leilão de 2015 e similares)
# Integradas com distribuição: a transmissão NÃO é ajustada (o consolidado mistura o ativo de contrato e o custo de
# construção da distribuição com os da transmissão), só VNR/bonificação; o app mostra a nota.
# "confirmar: true" = classificação a conferir (empresa pequena/pouco conhecida).

