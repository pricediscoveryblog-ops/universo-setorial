modelo_negocio: Incorporadora e construtora verticalizada (terreno, incorporação, construção e vendas) focada em
  residenciais de médio-alto e alto padrão nas regiões Sul e Oeste de São Paulo, incluindo projetos com bandeira
  hoteleira. Após vender a Melnick, concentrou a operação em São Paulo. Controle relevante da Nova Milano (veículo
  de Alexandre Grendene).
segmentos:
- Incorporação residencial alto padrão em São Paulo
- Construção própria
- Vendas próprias
historico:
- ano: 1980s
  fato: Origem como Terepins e Kalili Engenharia (denominação de 1986).
- ano: '2006'
  fato: Entrada do fundo Spinnaker Capital no capital.
- ano: '2015'
  fato: Nova Milano assume o controle na Bolsa, tendo a família Melnick como sócia.
- ano: '2024'
  fato: Conclui o desinvestimento da Melnick e passa a atuar só em São Paulo.
