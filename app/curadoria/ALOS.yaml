modelo_negocio: Dona e administradora de shopping centers. A receita vem principalmente do aluguel das lojas (mínimo
  e percentual sobre vendas), estacionamento, cessão de direitos e taxas de administração; o resultado operacional
  é o NOI dos shoppings. Desde 2022 a companhia vende participações em shoppings não dominantes e concentra o portfólio
  nos líderes de cada região, reciclando capital.
segmentos:
- Shoppings próprios (participações majoritárias e minoritárias)
- Administração de shoppings de terceiros
- Estacionamento, mídia e serviços aos lojistas
- Potencial construtivo para desenvolvimento imobiliário
historico:
- ano: '1975'
  fato: Origem da Aliansce como gestora do Shopping da Bahia.
- ano: '2019'
  fato: Fusão da Aliansce com a Sonae Sierra Brasil (Aliansce Sonae).
- ano: '2022'
  fato: Fusão com a brMalls aprovada pelos acionistas e pelo Cade; a brMalls passa a ser subsidiária integral.
- ano: '2023'
  fato: Início da operação combinada (62 shoppings em 40 municípios); adoção do nome ALLOS e do ticker ALOS3; desinvestimentos
    em shoppings não estratégicos.
