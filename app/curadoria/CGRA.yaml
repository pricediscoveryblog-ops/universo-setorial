modelo_negocio: Varejo de moda e utilidades do lar focado em cidades do interior do Sul (RS, SC e PR), com várias
  redes de lojas físicas. Complementa o varejo com financeira própria (crédito ao cliente das lojas), um shopping
  (Centro Shopping) e atividade florestal/agropecuária. Controle familiar via holding V.R. Grazziotin.
segmentos:
- Pormenos (autosserviço de vestuário; maior rede do grupo)
- 'Grazziotin (lojas de departamento: vestuário, calçados, cama/mesa/banho)'
- Tottal (casa e conforto)
- Franco Giorgi (moda masculina, marca própria) e GZT
- Grazziotin Financeira, Centro Shopping e floresta/Grato Agropecuária (JV)
historico:
- ano: '1950'
  fato: Abertura do atacado que deu origem ao grupo, em Passo Fundo (RS).
- ano: '1979'
  fato: Abertura de capital.
- ano: '2004'
  fato: Início da atividade de financeira.
- ano: '2024'
  fato: Enchentes no RS atingem diretamente 20 das ~350 lojas do grupo.
