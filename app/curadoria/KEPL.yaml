modelo_negocio: 'Fabricante de equipamentos de pós-colheita: silos metálicos, secadores, limpeza e transportadores
  de grãos, sistemas para portos e terminais, peças de reposição e serviços. Vende para fazendas, cooperativas,
  agroindústrias e terminais; a demanda acompanha a renda do agro, o crédito rural e o déficit estrutural de armazenagem
  no Brasil. Também exporta.'
segmentos:
- Fazendas (armazenagem na propriedade)
- Agroindústrias e cooperativas
- Portos e terminais
- Peças de reposição e serviços
- Exportação
historico:
- ano: '1925'
  fato: Fundação como ferraria pelos irmãos Otto e Adolfo Kepler em Panambi (RS).
- ano: '2004'
  fato: Inauguração da fábrica de Campo Grande (MS).
- ano: '2021'
  fato: Receita líquida recorde acima de R$ 1 bilhão.
