modelo_negocio: Maior fabricante de calçados esportivos do Brasil. Desenvolve, fabrica (fábricas próprias no Nordeste)
  e distribui para o varejo multimarca a marca própria Olympikus e as marcas licenciadas Under Armour e Mizuno no
  Brasil, além de vestuário e acessórios; tem poucas lojas próprias. A integração entre P&D, produção nacional e
  relação com o varejo é o centro do modelo.
segmentos:
- Olympikus (marca própria; corrida de performance, linha Corre)
- Under Armour (licença e distribuição exclusiva no Brasil)
- Mizuno (gestão da marca no Brasil desde 2021)
- Fábricas em Horizonte (CE) e Itapetinga (BA); operação no Peru
historico:
- ano: '1952'
  fato: Fundação da Companhia Brasileira de Calçados Vulcanizados.
- ano: '2018'
  fato: Contratos de distribuição e licenciamento exclusivo da Under Armour no Brasil por 10 anos.
- ano: '2021'
  fato: Passa a gerir a Mizuno no Brasil.
- ano: 2022–2026
  fato: Expansão e modernização das fábricas; sequência de trimestres consecutivos de crescimento de vendas.
