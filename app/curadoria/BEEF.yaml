modelo_negocio: 'Frigorífico de carne bovina (e ovina) focado em exportação: compra gado, abate e desossa em plantas
  em sete países da América do Sul e vende carne in natura e derivados, principalmente ao exterior (China é o maior
  destino). Margem depende do ciclo do gado, do câmbio e do acesso a mercados; o balanço é alavancado após a compra
  de ativos da Marfrig.'
segmentos:
- Brasil
- Athena Foods (Paraguai, Argentina, Uruguai, Colômbia, Chile)
- Austrália (ovinos)
- Trading e processados
historico:
- ano: Origem
  fato: Grupo da família Vilela de Queiroz, sede em Barretos (SP).
- ano: '2023'
  fato: Acordo para comprar ativos da Marfrig na América do Sul por R$ 7,5 bi.
- ano: '2024'
  fato: Conclui a compra de 13 plantas e 1 centro de distribuição (Brasil, Argentina, Chile), chegando a 46 unidades;
    prejuízo de R$ 1,57 bi no 4T24.
