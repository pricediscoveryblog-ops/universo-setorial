modelo_negocio: Soluções de identificação segura físicas e digitais. O núcleo é Identificação (emissão de documentos
  e gestão de dados para governos estaduais, com grande participação de mercado no Brasil, e certificação digital);
  completa com Meios de Pagamento (cartões com chip, contactless, pagamentos) e Mobile/conectividade segura (SIM/eSIM).
segmentos:
- Identificação e governo digital (núcleo estratégico)
- Meios de pagamento e banking
- Mobile / conectividade segura
historico:
- ano: '1957'
  fato: Início no Brasil como subsidiária da inglesa Thomas De La Rue (impressão de segurança).
- ano: '2006'
  fato: Listagem no Novo Mercado da B3.
- ano: '2010'
  fato: Saída da American Banknote Corporation como principal acionista; nova denominação Valid.
- ano: '2018'
  fato: Passa a se chamar Valid Soluções S.A.
